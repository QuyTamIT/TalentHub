server {
    listen 80;
    server_name ftalent.local;
    root D:/work/web/ftalenthub;
    index index.php;

    location ~ ^/api/v1(?:/.*)?$ {
        rewrite ^ /app/api/v1/index.php last;
    }

    location ~ ^/app/api/v1(?:/(?!index\.php$).*)$ {
        rewrite ^ /app/api/v1/index.php last;
    }

    location = /app/learner/assessment {
        return 301 /app/learner/assessment.php$is_args$args;
    }

    location = /app/learner/assessment/ {
        return 301 /app/learner/assessment.php$is_args$args;
    }

    location ~ ^/app/learner/assessment/(assessment(?:-result)?\.php)$ {
        return 301 /app/learner/$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ @php_extension;
    }

    location @php_extension {
        rewrite ^(.+?)/?$ $1.php last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }
}
